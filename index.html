<meta charset="utf-8">
<title>Bé Học Tiếng Anh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one full-screen "toy box" app — chunky pressable tiles, one big task per screen, nothing to scroll during play. */
/* Deliberately single bright look (a kids' toy), so no dark-theme blocks; every color is set explicitly. */
:root{
  --bg:#D7F1EC;        /* soft lagoon */
  --bg-deep:#B3E0D7;
  --ink:#23305C;       /* navy text */
  --muted:#56658A;
  --card:#FFFFFF;
  --card-edge:#C9D6E8;
  --sun:#FFC43D;  --sun-deep:#E39A00;
  --berry:#F2557D; --berry-deep:#C42F57;
  --leaf:#2FB067; --leaf-deep:#1E8048;
  --sky:#3F7FE8;  --sky-deep:#2457B0;
  --display:"Baloo 2","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sky);outline-offset:4px}

.screen{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;box-sizing:border-box;max-width:1100px;margin:0 auto}
.bar{display:flex;align-items:center;gap:12px;min-height:64px}
.bar h1{flex:1;min-width:0;margin:0;font-size:clamp(1.3rem,3.6vmin,2rem);line-height:1.1;text-align:center;text-wrap:balance}
.bar h1 small{display:block;font-size:.55em;font-weight:500;color:var(--muted)}
.round{width:64px;height:64px;flex:none;border-radius:50%;background:var(--card);box-shadow:0 5px 0 var(--card-edge);display:grid;place-items:center;transition:transform .08s}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--card-edge)}
.round svg{width:30px;height:30px}
.round.say{background:var(--sun);box-shadow:0 5px 0 var(--sun-deep)}
.spacer{width:64px;flex:none}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,4vmin,40px)}
.scroll .stage{overflow-y:auto;justify-content:flex-start;padding-block:4px 24px}

.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--bg-deep)}
.dots i.on{background:var(--leaf)}

/* ---------- start ---------- */
.splash{align-items:center;justify-content:center;text-align:center}
.splash .logo{font-size:clamp(3rem,10vmin,6rem);line-height:1;font-weight:800;margin:0;text-wrap:balance}
.splash .logo span{color:var(--berry)}
.splash p{margin:0;color:var(--muted);font-size:1.05rem;max-width:34ch}
.bigplay{width:clamp(150px,30vmin,220px);aspect-ratio:1;border-radius:50%;background:var(--berry);box-shadow:0 10px 0 var(--berry-deep);display:grid;place-items:center;animation:breathe 2.4s ease-in-out infinite}
.bigplay svg{width:45%;height:45%}
.bigplay:active{transform:translateY(8px);box-shadow:0 2px 0 var(--berry-deep)}
.friends{font-size:clamp(2.2rem,7vmin,3.6rem);letter-spacing:.15em}

/* ---------- tiles (home + topic) ---------- */
.grid{width:100%;max-width:960px;display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(140px,27vmin,230px),1fr));gap:clamp(12px,2.5vmin,24px)}
.grid.six{grid-template-columns:repeat(3,minmax(0,1fr));max-width:820px}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.grid.four{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px}}
@media (max-width:560px){.grid.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;background:var(--t,#fff);border-radius:32px;box-shadow:0 8px 0 var(--td,#ccc);padding:clamp(12px,2.5vmin,22px) 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 var(--td,#ccc)}
.tile .ico{font-size:clamp(3.2rem,11vmin,5.5rem);line-height:1.1}
.tile b{font-size:clamp(1.3rem,3.4vmin,1.9rem);font-weight:800;line-height:1.1}
.tile small{font-size:clamp(.85rem,2.2vmin,1.05rem);color:var(--ink);opacity:.72}
.tile .star{position:absolute;top:10px;right:14px;font-size:1.6rem;color:var(--sun-deep)}
.parents{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:960px}
.chip{background:var(--card);border-radius:999px;padding:10px 18px;font-size:1rem;font-weight:700;box-shadow:0 4px 0 var(--card-edge);display:flex;gap:8px;align-items:center}
.chip .sw{width:40px;height:24px;border-radius:12px;background:var(--card-edge);position:relative;transition:background .15s}
.chip .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.chip[aria-pressed="true"] .sw{background:var(--leaf)}
.chip[aria-pressed="true"] .sw::after{left:19px}
.note{font-size:.9rem;color:var(--muted);text-align:center;margin:0}

/* ---------- picture cards ---------- */
.card{--s:clamp(110px,min(29vw,33vh),240px);width:var(--s);height:var(--s);flex:none;border-radius:28%;background:var(--card);box-shadow:0 8px 0 var(--card-edge);display:grid;place-items:center;position:relative;transition:transform .1s,box-shadow .1s}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 var(--card-edge)}
.emo{font-size:calc(var(--s)*.6);line-height:1}
.blob{width:66%;aspect-ratio:1;background:var(--c);border-radius:46% 54% 52% 48%/50% 44% 56% 50%;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.25)}
.num{display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*.03)}
.num b{font-size:calc(var(--s)*.42);line-height:.9;font-weight:800;color:var(--sky)}
.num .pips{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--s)*.03);max-width:calc(var(--s)*.7)}
.num .pips i{width:calc(var(--s)*.11);height:calc(var(--s)*.11);border-radius:50%;background:var(--berry)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,3.5vmin,36px)}
.prompt{margin:0;font-size:clamp(1.6rem,5vmin,2.8rem);font-weight:800;text-align:center;line-height:1.1}
.prompt small{display:block;font-size:.5em;font-weight:500;color:var(--muted)}

.good{box-shadow:0 0 0 8px var(--leaf),0 8px 0 var(--card-edge);animation:pop .45s}
.bad{animation:shake .45s}
.dim{opacity:.35;transition:opacity .3s}

/* learn */
.learn .card{--s:clamp(200px,min(70vw,50vh),420px)}
.learn .word{margin:0;text-align:center;font-size:clamp(2.4rem,9vmin,5rem);font-weight:800;line-height:1}
.learn .word small{display:block;font-size:.38em;font-weight:500;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:clamp(30px,10vw,120px)}
.arrow{width:84px;height:84px;border-radius:50%;background:var(--sky);box-shadow:0 7px 0 var(--sky-deep);display:grid;place-items:center}
.arrow:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sky-deep)}
.arrow svg{width:40px;height:40px}
.bounce{animation:pop .45s}

/* drag */
.zone{--s:clamp(130px,min(36vw,32vh),260px);width:calc(var(--s)*1.1);height:calc(var(--s)*1.1);border-radius:30%;border:6px dashed var(--muted);display:grid;place-items:center;background:rgba(255,255,255,.4);transition:background .2s,border-color .2s}
.zone.hot{background:rgba(255,255,255,.85);border-color:var(--leaf)}
.zone.done{border-style:solid;border-color:var(--leaf);background:var(--card)}
.ghost .emo{filter:brightness(0);opacity:.18}
.ghost .blob,.ghost .num{opacity:.3}
.drag-row .card{touch-action:none;cursor:grab}
.drag-row .card.dragging{z-index:10;transition:none;box-shadow:0 18px 30px rgba(35,48,92,.25);cursor:grabbing}
.drag-row .card.back{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}

/* match */
.mgrid{--s:clamp(90px,min(27vw,30vh),190px);display:grid;grid-template-columns:repeat(3,var(--s));gap:clamp(12px,2.5vmin,24px)}
@media (orientation:portrait) and (max-width:500px){.mgrid{--s:clamp(90px,min(40vw,22vh),190px);grid-template-columns:repeat(2,var(--s))}}
.mcard{width:var(--s);height:var(--s);perspective:800px;background:none;padding:0}
.mcard .in{display:block;position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:24%;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .b{background:var(--sun);box-shadow:0 6px 0 var(--sun-deep)}
.mcard .b span{font-size:calc(var(--s)*.38);font-weight:800;color:#fff}
.mcard .f{background:var(--card);box-shadow:0 6px 0 var(--card-edge);transform:rotateY(180deg)}
.mcard.matched .f{box-shadow:0 0 0 6px var(--leaf)}
.mcard .f .emo{font-size:calc(var(--s)*.58)}

/* celebrate */
.yay{align-items:center;justify-content:center;text-align:center}
.bigstars{display:flex;gap:10px;font-size:clamp(4rem,14vmin,8rem);line-height:1;color:var(--sun)}
.bigstars span{display:inline-block;animation:popin .5s backwards;text-shadow:0 6px 0 var(--sun-deep)}
.bigstars span:nth-child(2){animation-delay:.15s;transform:translateY(-14px)}
.bigstars span:nth-child(3){animation-delay:.3s}
.yay h2{margin:0;font-size:clamp(2.4rem,8vmin,4.5rem);line-height:1}
.yay h2 small{display:block;font-size:.4em;font-weight:500;color:var(--muted)}
.btns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pill{border-radius:999px;padding:14px 28px;font-size:1.3rem;font-weight:800;display:flex;gap:10px;align-items:center}
.pill svg{width:28px;height:28px}
.pill.go{background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-deep)}
.pill.alt{background:var(--card);box-shadow:0 6px 0 var(--card-edge)}
.pill:active{transform:translateY(4px)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(0) rotate(-40deg)}100%{}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
/* ================= DATA ================= */
const TOPICS = [
  {id:'animals', en:'Animals', vi:'Con vật', icon:'🐱', t:'#FFDDB0', td:'#E8AE62', kind:'emoji', items:[
    ['cat','con mèo','🐱'],['dog','con chó','🐶'],['fish','con cá','🐟'],['bird','con chim','🐦'],
    ['duck','con vịt','🦆'],['cow','con bò','🐮'],['pig','con heo','🐷'],['chicken','con gà','🐔']]},
  {id:'fruits', en:'Fruits', vi:'Trái cây', icon:'🍎', t:'#FFD0DC', td:'#E68BA3', kind:'emoji', items:[
    ['apple','quả táo','🍎'],['banana','quả chuối','🍌'],['orange','quả cam','🍊'],['grapes','quả nho','🍇'],
    ['watermelon','dưa hấu','🍉'],['mango','quả xoài','🥭'],['strawberry','dâu tây','🍓'],['pineapple','quả dứa','🍍']]},
  {id:'colors', en:'Colors', vi:'Màu sắc', icon:'🎨', t:'#E3D6FF', td:'#A98BE6', kind:'color', items:[
    ['red','màu đỏ','#E8343F'],['blue','màu xanh dương','#2F6FE4'],['yellow','màu vàng','#FFD21F'],['green','màu xanh lá','#2DB55D'],
    ['orange','màu cam','#FF8A1F'],['purple','màu tím','#8E4FD6'],['pink','màu hồng','#FF7EB6'],['brown','màu nâu','#8B5A2B']]},
  {id:'numbers', en:'Numbers', vi:'Con số', icon:'🔢', t:'#CDE3FF', td:'#7EA7E0', kind:'number', items:[
    ['one','số một',1],['two','số hai',2],['three','số ba',3],['four','số bốn',4],['five','số năm',5]]},
  {id:'vehicles', en:'Vehicles', vi:'Xe cộ', icon:'🚗', t:'#C9F0D3', td:'#6FC287', kind:'emoji', items:[
    ['car','xe ô tô','🚗'],['bus','xe buýt','🚌'],['bike','xe đạp','🚲'],['motorbike','xe máy','🛵'],
    ['boat','con thuyền','⛵'],['plane','máy bay','✈️'],['train','tàu hỏa','🚂'],['truck','xe tải','🚚']]},
  {id:'body', en:'My Body', vi:'Cơ thể', icon:'👂', t:'#FFF1B0', td:'#E0C04A', kind:'emoji', items:[
    ['eye','con mắt','👁️'],['ear','cái tai','👂'],['nose','cái mũi','👃'],['mouth','cái miệng','👄'],
    ['hand','bàn tay','✋'],['foot','bàn chân','🦶']]},
].map(t => ({...t, items: t.items.map(([en,vi,v]) => ({en,vi,v}))}));

const MODES = [
  {id:'learn', en:'Learn', vi:'Học từ mới', icon:'👀', t:'#FFFFFF', td:'#C9D6E8'},
  {id:'find',  en:'Find it', vi:'Chạm đúng hình', icon:'👆', t:'#FFE7A3', td:'#E3B23C'},
  {id:'drag',  en:'Drag', vi:'Kéo vào bóng', icon:'✋', t:'#CFF2DD', td:'#6CC08F'},
  {id:'match', en:'Match', vi:'Lật thẻ tìm cặp', icon:'🃏', t:'#FFD6E2', td:'#E78BA6'},
];
const ROUNDS = 5;

/* ================= HELPERS ================= */
const app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOthers = (list, not, n) => shuffle(list.filter(x => x !== not)).slice(0, n);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const settings = Object.assign({vi:true, slow:true}, store.get('bhta-settings', {}));
const stars = store.get('bhta-stars', {});

let gen = 0;                       // bumps on every screen change so old timers do nothing
const later = (fn, ms) => { const g = gen; setTimeout(() => { if (g === gen) fn(); }, ms); };

const ICON = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="#23305C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="#23305C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  speak:'<svg viewBox="0 0 24 24" fill="#23305C"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="#23305C" stroke-width="2.2" stroke-linecap="round"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l13-7.5z"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  again:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>',
};

/* ================= SOUND ================= */
/* Every spoken line, in one place. tools/generate-audio.mjs records each of these to an MP3. */
const art = t => t.kind === 'emoji' ? 'the ' : '';
const SAY = {
  hello:   () => ["Hello! Let's learn English!", 'Xin chào! Cùng học tiếng Anh nào!'],
  pairs:   () => ['Find the pairs!', 'Tìm hai hình giống nhau nhé!'],
  win:     () => ['Great job! You did it!', 'Bé giỏi quá!'],
  topic:   t => [t.en, t.vi],
  word:    o => [o.en, o.vi],
  find:    (o, t) => [phrase('Find', o, t), `Tìm ${o.vi} nào!`],
  drag:    (o, t) => [phrase('Drag', o, t), `Kéo ${o.vi} vào khung nhé!`],
  findYes: o => [`Yes! ${o.en}!`, `Đúng rồi! ${o.vi}!`],
  dragYes: o => [`Yes! ${o.en}!`, `Giỏi quá! ${o.vi}!`],
  thatIs:  (o, t) => [`That is ${art(t)}${o.en}.`, `Đây là ${o.vi}.`],
  retry:   (o, t) => [`That is ${art(t)}${o.en}. Try again!`, `Đây là ${o.vi}. Thử lại nhé!`],
  pairYes: o => [`${o.en}! Good job!`, `${o.vi}! Giỏi lắm!`],
};
// The full list of lines to record, de-duplicated: [{lang, text, key}]
window.ALL_LINES = () => {
  const pairs = [SAY.hello(), SAY.pairs(), SAY.win()];
  TOPICS.forEach(t => {
    pairs.push(SAY.topic(t));
    t.items.forEach(o => ['word', 'find', 'drag', 'findYes', 'dragYes', 'thatIs', 'retry', 'pairYes'].forEach(k => pairs.push(SAY[k](o, t))));
  });
  const seen = new Map();
  pairs.forEach(([en, vi]) => [['en', en], ['vi', vi]].forEach(([lang, text]) => { const key = clipKey(lang, text); seen.set(key, {lang, text, key}); }));
  return [...seen.values()];
};
const clipKey = (lang, text) => {
  let h = 2166136261; for (const ch of text.trim().toLowerCase()) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return lang + '-' + (h >>> 0).toString(36);
};

// Recorded clips: CLIPS maps key -> playable URL. When a line has a clip it is played;
// otherwise we fall back to the device's built-in voice.
// The clips come joined into a few MP3 packs (audio/packs.json: key -> [pack, offset, length], made by
// tools/pack-audio.mjs); without packs we use the single files listed in audio/manifest.json.
const CLIPS = {};
const getJson = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
getJson('audio/packs.json').then(async index => {
  if (!index){
    const m = await getJson('audio/manifest.json') || {};
    Object.keys(m).forEach(k => { CLIPS[k] = 'audio/' + m[k]; });
    return;
  }
  const byPack = {};
  Object.entries(index).forEach(([k, [pack, at, len]]) => (byPack[pack] = byPack[pack] || []).push([k, at, len]));
  for (const pack of Object.keys(byPack).sort()){   // English packs first
    try {
      const buf = await (await fetch('audio/' + pack)).arrayBuffer();
      byPack[pack].forEach(([k, at, len]) => { CLIPS[k] = URL.createObjectURL(new Blob([buf.slice(at, at + len)], {type: 'audio/mpeg'})); });
    } catch(e){}
  }
});
const player = new Audio();          // one element, unlocked by the first tap, reused (iOS blocks new ones)
player.preload = 'auto';
let queue = [];   // the start button's greeting plays inside a tap, which unlocks this element on iOS
player.onended = () => playPart();
function stopVoice(){
  queue = []; try { player.pause(); } catch(e){}
  try { speechSynthesis.cancel(); } catch(e){}
}

let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch(e){} };
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  const norm = v => (v.lang || '').replace('_', '-').toLowerCase();
  const list = voices.filter(v => norm(v).startsWith(lang.slice(0, 2)));
  if (!list.length) return null;
  const exact = list.filter(v => norm(v) === lang.toLowerCase());
  const pool = exact.length ? exact : list;
  const nice = ['Premium', 'Enhanced', 'Samantha', 'Google US English', 'Linh', 'Google Tiếng Việt'];
  return pool.find(v => nice.some(n => v.name.includes(n))) || pool.find(v => v.localService) || pool[0];
}
let talkId = 0;
function utter(text, lang, onDone){
  const id = talkId;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; const v = pickVoice(lang); if (v) u.voice = v;
  u.rate = lang.startsWith('en') ? (settings.slow ? 0.85 : 1) : 1;
  let done = false;
  const fin = () => { if (!done && id === talkId){ done = true; onDone(); } };
  u.onend = fin; u.onerror = fin;
  setTimeout(fin, 1200 + text.length * 110);   // some browsers never fire onend
  speechSynthesis.speak(u);
}
// Each part is played from its recorded clip when there is one, otherwise read by the device voice.
function playPart(){
  const part = queue.shift(); if (!part) return;
  const [lang, text] = part;
  const url = CLIPS[clipKey(lang, text)];
  if (url){
    player.muted = false; player.src = url; player.playbackRate = settings.slow ? 1 : 1.1;
    player.play().catch(playPart);
  } else if ('speechSynthesis' in window && (lang === 'en' || pickVoice('vi-VN'))){
    try { utter(text, lang === 'en' ? 'en-US' : 'vi-VN', playPart); } catch(e){ playPart(); }
  } else playPart();
}
// Say the English line, then (optionally) the Vietnamese meaning.
function talk(en, vi){
  stopVoice(); talkId++;
  queue = [['en', en]];
  if (vi && settings.vi) queue.push(['vi', vi]);
  playPart();
}
// iOS only lets an audio element play later if it first played during a tap.
function unlockAudio(){
  const url = 'data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAACQAABCAARUVFRUVFRUVFRUVdXV1dXV1dXV1dXXR0dHR0dHR0dHR0i4uLi4uLi4uLi4uioqKioqKioqKiorq6urq6urq6urq60dHR0dHR0dHR0dHo6Ojo6Ojo6Ojo6P//////////////AAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAACQD8AAAAAAAAAQgDeb0IwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//NExAAAAANIAAAAAExBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExFMAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKYAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NExKwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NExKwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV';   // a short silence
  try { player.muted = true; player.src = url; player.play().then(() => player.pause()).catch(() => {}); } catch(e){}
}
let ac;
function tone(freqs, type, step){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * step;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + step * 1.8);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + step * 2);
    });
  } catch(e){}
}
const sfx = {
  yay: () => tone([523, 659, 784, 1047], 'triangle', 0.09),
  oops: () => tone([330, 247], 'sine', 0.14),
  pop: () => tone([700], 'sine', 0.06),
  flip: () => tone([520, 640], 'sine', 0.05),
  win: () => tone([523, 659, 784, 659, 784, 1047, 1319], 'triangle', 0.11),
};

/* ================= RENDER PIECES ================= */
function visual(item, topic){
  if (topic.kind === 'color') return `<span class="blob" style="--c:${item.v}"></span>`;
  if (topic.kind === 'number') return `<span class="num"><b>${item.v}</b><span class="pips">${'<i></i>'.repeat(item.v)}</span></span>`;
  return `<span class="emo">${item.v}</span>`;
}
function phrase(verb, item, topic){
  if (topic.kind === 'color') return `${verb} ${item.en}!`;
  if (topic.kind === 'number') return `${verb} number ${item.en}!`;
  return `${verb} the ${item.en}!`;
}
function bar({back, title, sub, sayBtn, dots}){
  return `<header class="bar">
    ${back ? `<button class="round" id="back" aria-label="Quay lại">${back === 'home' ? ICON.home : ICON.back}</button>` : '<span class="spacer"></span>'}
    <h1>${title}${sub ? `<small>${sub}</small>` : ''}${dots != null ? dotsHtml(dots) : ''}</h1>
    ${sayBtn ? `<button class="round say" id="say" aria-label="Nghe lại">${ICON.speak}</button>` : '<span class="spacer"></span>'}
  </header>`;
}
function dotsHtml(done){
  return `<span class="dots" aria-label="Câu ${done + 1} / ${ROUNDS}">${Array.from({length: ROUNDS}, (_, i) => `<i class="${i < done ? 'on' : ''}"></i>`).join('')}</span>`;
}
function show(html, cls = ''){
  gen++;
  stopVoice();
  app.innerHTML = `<section class="screen ${cls}">${html}</section>`;
}
const $ = s => app.querySelector(s);
const $$ = s => [...app.querySelectorAll(s)];
function onBack(fn){ const b = $('#back'); if (b) b.onclick = () => { sfx.pop(); fn(); }; }

/* ================= SCREENS ================= */
function startScreen(){
  show(`<div class="stage">
      <div class="friends" aria-hidden="true">🐶🍎🚗🎨</div>
      <h1 class="logo">Bé Học <span>Tiếng Anh</span></h1>
      <button class="bigplay" id="go" aria-label="Bắt đầu">${ICON.play}</button>
      <p>Bố mẹ nhớ bật loa và tắt chế độ im lặng trên iPhone/iPad để bé nghe được giọng đọc nhé.</p>
    </div>`, 'splash');
  $('#go').onclick = () => {
    homeScreen();
    sfx.yay(); unlockAudio();
    talk(...SAY.hello());
  };
}

function homeScreen(){
  show(`${bar({back: null, title: 'Choose a topic', sub: 'Chọn chủ đề'})}
    <div class="stage">
      <div class="grid six">${TOPICS.map(t => {
        const done = MODES.filter(m => stars[t.id + ':' + m.id]).length;
        return `<button class="tile" data-t="${t.id}" style="--t:${t.t};--td:${t.td}">
          ${done ? `<span class="star" aria-label="${done} sao">${'★'.repeat(Math.min(done, 3))}</span>` : ''}
          <span class="ico">${t.icon}</span><b>${t.en}</b><small>${t.vi}</small></button>`;
      }).join('')}</div>
      <div class="parents">
        <button class="chip" id="optVi" aria-pressed="${settings.vi}"><span class="sw"></span>Đọc nghĩa tiếng Việt</button>
        <button class="chip" id="optSlow" aria-pressed="${settings.slow}"><span class="sw"></span>Đọc chậm</button>
      </div>
    </div>`, 'scroll');
  $$('.tile').forEach(b => b.onclick = () => {
    const t = TOPICS.find(x => x.id === b.dataset.t);
    sfx.pop(); topicScreen(t); talk(...SAY.topic(t));
  });
  const toggle = (id, key) => $(id).onclick = e => {
    settings[key] = !settings[key]; store.set('bhta-settings', settings);
    e.currentTarget.setAttribute('aria-pressed', settings[key]); sfx.pop();
  };
  toggle('#optVi', 'vi'); toggle('#optSlow', 'slow');
}

function topicScreen(t){
  show(`${bar({back: 'home', title: `${t.icon} ${t.en}`, sub: t.vi})}
    <div class="stage">
      <div class="grid four">${MODES.map(m => `<button class="tile" data-m="${m.id}" style="--t:${m.t};--td:${m.td}">
        ${stars[t.id + ':' + m.id] ? '<span class="star" aria-label="Đã xong">★</span>' : ''}
        <span class="ico">${m.icon}</span><b>${m.en}</b><small>${m.vi}</small></button>`).join('')}</div>
    </div>`, 'scroll');
  onBack(() => homeScreen());
  $$('.tile').forEach(b => b.onclick = () => { sfx.pop(); GAMES[b.dataset.m](t); });
}

/* ----- Learn: flashcards ----- */
function learn(t, i = 0){
  const item = t.items[i];
  show(`${bar({back: 'back', title: `${t.en}`, sub: `${i + 1} / ${t.items.length}`, sayBtn: true})}
    <div class="stage learn">
      <button class="card" id="card" aria-label="${item.en}">${visual(item, t)}</button>
      <p class="word">${item.en}${settings.vi ? `<small>${item.vi}</small>` : ''}</p>
      <div class="nav">
        <button class="arrow" id="prev" aria-label="Trước">${ICON.left}</button>
        <button class="arrow" id="next" aria-label="Tiếp">${ICON.right}</button>
      </div>
    </div>`);
  const say = () => { talk(...SAY.word(item)); const c = $('#card'); c.classList.remove('bounce'); void c.offsetWidth; c.classList.add('bounce'); };
  later(say, 250);
  onBack(() => topicScreen(t));
  $('#say').onclick = say;
  $('#card').onclick = say;
  const next = () => { sfx.pop(); if (i + 1 >= t.items.length) celebrate(t, 'learn'); else learn(t, i + 1); };
  const prev = () => { sfx.pop(); learn(t, (i - 1 + t.items.length) % t.items.length); };
  $('#next').onclick = next; $('#prev').onclick = prev;
  // swipe left/right on the stage
  let sx = null;
  $('.stage').addEventListener('pointerdown', e => { sx = e.clientX; });
  $('.stage').addEventListener('pointerup', e => {
    if (sx == null) return; const dx = e.clientX - sx; sx = null;
    if (dx < -70) next(); else if (dx > 70) prev();
  });
}

/* ----- Find it: hear a word, tap the right picture ----- */
function find(t, round = 0, prevTarget = null){
  const target = shuffle(t.items.filter(x => x !== prevTarget))[0];
  const opts = shuffle([target, ...pickOthers(t.items, target, 2)]);
  const [en, vi] = SAY.find(target, t);
  show(`${bar({back: 'back', title: '', sayBtn: true, dots: round})}
    <div class="stage">
      <p class="prompt">${en}${settings.vi ? `<small>${vi}</small>` : ''}</p>
      <div class="row">${opts.map((o, k) => `<button class="card" data-k="${k}" aria-label="${o.en}">${visual(o, t)}</button>`).join('')}</div>
    </div>`);
  onBack(() => topicScreen(t));
  const ask = () => talk(en, vi);
  later(ask, 250);
  $('#say').onclick = ask;
  let locked = false;
  $$('.row .card').forEach(b => b.onclick = () => {
    if (locked) return;
    const o = opts[+b.dataset.k];
    if (o === target){
      locked = true; sfx.yay(); b.classList.add('good');
      $$('.row .card').forEach(x => { if (x !== b) x.classList.add('dim'); });
      later(() => talk(...SAY.findYes(target)), 250);
      later(() => round + 1 >= ROUNDS ? celebrate(t, 'find') : find(t, round + 1, target), 2200);
    } else {
      sfx.oops(); b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
      talk(...SAY.thatIs(o, t));
    }
  });
}

/* ----- Drag: drag the right picture onto its shadow ----- */
function drag(t, round = 0, prevTarget = null){
  const target = shuffle(t.items.filter(x => x !== prevTarget))[0];
  const opts = shuffle([target, ...pickOthers(t.items, target, 2)]);
  const [en, vi] = SAY.drag(target, t);
  show(`${bar({back: 'back', title: '', sayBtn: true, dots: round})}
    <div class="stage">
      <div class="zone ghost" id="zone" aria-label="Khung đích">${visual(target, t)}</div>
      <p class="prompt">${en}${settings.vi ? `<small>${vi}</small>` : ''}</p>
      <div class="row drag-row">${opts.map((o, k) => `<div class="card" data-k="${k}" role="button" aria-label="${o.en}">${visual(o, t)}</div>`).join('')}</div>
    </div>`);
  onBack(() => topicScreen(t));
  const ask = () => talk(en, vi);
  later(ask, 250);
  $('#say').onclick = ask;
  const zone = $('#zone');
  let locked = false;
  const inZone = (x, y) => { const r = zone.getBoundingClientRect(); return x > r.left && x < r.right && y > r.top && y < r.bottom; };

  $$('.drag-row .card').forEach(el => {
    const o = opts[+el.dataset.k];
    let sx, sy, moved = false, active = false;
    el.addEventListener('pointerdown', e => {
      if (locked) return;
      active = true; moved = false; sx = e.clientX; sy = e.clientY;
      el.setPointerCapture(e.pointerId);
      el.classList.remove('back'); el.classList.add('dragging');
    });
    el.addEventListener('pointermove', e => {
      if (!active) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 10) moved = true;
      el.style.transform = `translate(${dx}px,${dy}px) scale(1.08)`;
      zone.classList.toggle('hot', inZone(e.clientX, e.clientY));
    });
    const end = e => {
      if (!active) return; active = false;
      el.classList.remove('dragging'); zone.classList.remove('hot');
      if (!moved){ el.style.transform = ''; talk(...SAY.word(o)); return; }
      if (inZone(e.clientX, e.clientY) && o === target){
        locked = true; sfx.yay();
        // snap into the zone centre
        const z = zone.getBoundingClientRect(), r = el.getBoundingClientRect();
        const cur = new DOMMatrix(getComputedStyle(el).transform);
        el.classList.add('back');
        el.style.transform = `translate(${cur.m41 + (z.left + z.width / 2) - (r.left + r.width / 2)}px,${cur.m42 + (z.top + z.height / 2) - (r.top + r.height / 2)}px)`;
        zone.classList.add('done');
        $$('.drag-row .card').forEach(x => { if (x !== el) x.classList.add('dim'); });
        later(() => talk(...SAY.dragYes(target)), 300);
        later(() => round + 1 >= ROUNDS ? celebrate(t, 'drag') : drag(t, round + 1, target), 2300);
      } else {
        if (inZone(e.clientX, e.clientY)){ sfx.oops(); talk(...SAY.retry(o, t)); }
        el.classList.add('back'); el.style.transform = '';
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
}

/* ----- Match: memory game with 3 pairs ----- */
function match(t){
  const picks = shuffle(t.items).slice(0, 3);
  const deck = shuffle([...picks, ...picks]);
  show(`${bar({back: 'back', title: 'Find the pairs', sub: 'Lật thẻ, tìm 2 hình giống nhau'})}
    <div class="stage">
      <div class="mgrid">${deck.map((o, k) => `<button class="mcard" data-k="${k}" aria-label="Thẻ ${k + 1}">
        <span class="in"><span class="b"><span>?</span></span><span class="f">${visual(o, t)}</span></span></button>`).join('')}</div>
    </div>`);
  onBack(() => topicScreen(t));
  later(() => talk(...SAY.pairs()), 250);
  let open = [], busy = false, found = 0;
  $$('.mcard').forEach(b => b.onclick = () => {
    if (busy || b.classList.contains('open')) return;
    const o = deck[+b.dataset.k];
    b.classList.add('open'); sfx.flip(); talk(o.en);
    open.push(b);
    if (open.length < 2) return;
    const [a, c] = open; open = [];
    if (deck[+a.dataset.k] === deck[+c.dataset.k]){
      found++;
      later(() => { sfx.yay(); a.classList.add('matched'); c.classList.add('matched'); talk(...SAY.pairYes(o)); }, 450);
      if (found === picks.length) later(() => celebrate(t, 'match'), 2400);
    } else {
      busy = true;
      later(() => { a.classList.remove('open'); c.classList.remove('open'); busy = false; }, 1300);
    }
  });
}

/* ----- Celebrate ----- */
function celebrate(t, mode){
  stars[t.id + ':' + mode] = true; store.set('bhta-stars', stars);
  show(`<div class="stage">
      <div class="bigstars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
      <h2>Great job!<small>Bé giỏi quá!</small></h2>
      <div class="btns">
        <button class="pill go" id="again">${ICON.again}Chơi lại</button>
        <button class="pill alt" id="more">Chọn trò khác</button>
      </div>
    </div>`, 'yay');
  sfx.win();
  later(() => talk(...SAY.win()), 500);
  confetti();
  $('#again').onclick = () => { sfx.pop(); GAMES[mode](t); };
  $('#more').onclick = () => { sfx.pop(); topicScreen(t); };
}
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#F2557D', '#FFC43D', '#2FB067', '#3F7FE8', '#8E4FD6'];
  box.innerHTML = Array.from({length: 60}, (_, i) =>
    `<i style="left:${Math.random() * 100}%;background:${cols[i % 5]};animation-duration:${1.8 + Math.random() * 1.6}s;animation-delay:${Math.random() * .5}s"></i>`).join('');
  app.querySelector('.screen').appendChild(box);
}

const GAMES = {learn, find, drag, match};
startScreen();
</script>
